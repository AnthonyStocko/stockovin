apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    buildToolsVersion "33.0.1"
    ndkVersion '21.3.6528147'

    defaultConfig {
        minSdkVersion 25
        targetSdkVersion 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    buildFeatures {
        aidl true
    }
    namespace 'org.opencv'
}
