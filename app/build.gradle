// 1. LE BLOC BUILDSCRIPT DOIT TOUJOURS ÊTRE EN PREMIER
buildscript {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io' // Repassé en HTTPS pour la sécurité des builds récents
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.2'
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

// 2. LES PLUGINS ET APPLICATIONS APRÈS
plugins {
    id 'com.android.application'
}

apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 34
    buildToolsVersion "35.0.1"
    ndkVersion '21.3.6528147'

    defaultConfig {
        applicationId "net.stockovin"
        minSdkVersion 25
        targetSdkVersion 34
        versionCode 44
        versionName "4.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    splits {
        abi {
            enable true
            reset()
            include 'x86', 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'mips', 'mips64', 'x86_64'
            universalApk true
        }
    }
    namespace 'net.stockovin'

    project.ext.versionCodes = ['armeabi': 1, 'armeabi-v7a': 2, 'arm64-v8a': 3, 'mips': 5, 'mips64': 6, 'x86': 8, 'x86_64': 9]

    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride =
                    project.ext.versionCodes.get(output.getFilter(
                            com.android.build.OutputFile.ABI), 0) * 10000000 + android.defaultConfig.versionCode
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Modules locaux
    implementation project(path: ':openCVLibrary343')

    // Bibliothèques tierces
    implementation 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'
    implementation 'com.github.gastricspark:scrolldatepicker:0.0.1'

    // CORRECTION TOURGUIDE : Ciblage du dernier état stable connu de la branche master compilé par JitPack
    implementation 'com.github.worker8:TourGuide:master-SNAPSHOT'

    implementation 'com.google.android.ads:mediation-test-suite:3.0.0'

    // Jars locaux
    implementation files('libs/activation.jar')
    implementation files('libs/additionnal.jar')
    implementation files('libs/mail.jar')

    // Firebase aligné sur le BoM
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
    implementation 'androidx.work:work-runtime-ktx:2.7.1'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
        }
    }
}

task cleanProject(type: Delete) {
    delete rootProject.buildDir
}